[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "audiostream2py"
version = "0.1.23"
description = "stream2py interface for audio"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = [
    "audio",
    "stream",
    "stream2py",
    "pyaudio",
    "real-time",
    "signal-processing",
]
authors = [
    { name = "Thor Whalen" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
]
dependencies = [
    "stream2py",
    "pyaudio",
]

[project.urls]
Homepage = "https://github.com/i2mint/audiostream2py"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "audiostream2py",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

[tool.wads.ops.portaudio]
description = "PortAudio - the native library pyaudio binds to (provides portaudio.h)"
url = "https://www.portaudio.com/"
check.linux = "ldconfig -p | grep -q libportaudio"
check.macos = "brew list portaudio"
check.windows = "python -c \"import pyaudio\""
install.linux = ["sudo apt-get update", "sudo apt-get install -y portaudio19-dev"]
install.macos = "brew install portaudio"
install.windows = "echo pyaudio ships prebuilt Windows wheels; no system install needed"

[tool.wads.ci]
project_name = ""

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
# PortAudio-backed audio capture is finicky on headless Windows CI (and the
# wads install-system-deps action can't encode its ✓ output on cp1252) — Linux
# + macOS cover it.
test_on_windows = false

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
